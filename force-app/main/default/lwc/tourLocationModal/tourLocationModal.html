<template>
    <!-- SLDS Modal Backdrop -->
    <div role="presentation">
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="modal-heading"
            class="slds-modal slds-fade-in-open tour-location-modal"
        >
            <div class="slds-modal__container">

                <!-- Modal Header -->
                <header class="slds-modal__header modal-header-custom">
                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleCancel}
                    >
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            variant="inverse"
                            size="small"
                        ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading" class="slds-modal__title slds-hyphenate modal-title">
                        <lightning-icon
                            icon-name="utility:map"
                            size="small"
                            alternative-text="Tour"
                            class="slds-m-right_small modal-title-icon"
                        ></lightning-icon>
                        Available Tours – {formattedSlotTime}
                    </h2>
                    <p class="modal-subtitle">{selectedDate} &bull; {areaLabel}</p>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_none modal-body">
                    <template if:true={isLoading}>
                        <div class="modal-loading">
                            <lightning-spinner alternative-text="Loading locations..." size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isLoading}>
                        <template if:true={hasLocations}>
                            <ul class="location-list" role="listbox" aria-label="Available tour locations">
                                <template for:each={availableLocations} for:item="loc">
                                    <li
                                        key={loc.id}
                                        class={loc.rowClass}
                                        role="option"
                                        aria-selected={loc.isSelected}
                                        data-id={loc.id}
                                        onclick={handleLocationSelect}
                                        tabindex="0"
                                        onkeypress={handleLocationKeyPress}
                                    >
                                        <div class="location-row-content slds-grid slds-grid_vertical-align-center">
                                            <!-- Selection Indicator -->
                                            <div class="slds-col slds-no-flex location-select-icon">
                                                <template if:true={loc.isSelected}>
                                                    <lightning-icon
                                                        icon-name="utility:check"
                                                        size="small"
                                                        alternative-text="Selected"
                                                        class="check-icon"
                                                    ></lightning-icon>
                                                </template>
                                                <template if:false={loc.isSelected}>
                                                    <div class="radio-circle"></div>
                                                </template>
                                            </div>

                                            <!-- Location Info -->
                                            <div class="slds-col location-info">
                                                <div class="location-name">{loc.name}</div>
                                                <template if:true={loc.area}>
                                                    <div class="location-area">{loc.area}</div>
                                                </template>
                                                <template if:true={loc.description}>
                                                    <div class="location-description">{loc.description}</div>
                                                </template>
                                            </div>

                                            <!-- Available Slots Badge -->
                                            <div class="slds-col slds-no-flex location-slots">
                                                <span class="slots-badge">
                                                    <span class="slots-dot"></span>
                                                    {loc.availableSlots} slot{loc.slotPlural}
                                                </span>
                                            </div>

                                            <!-- Arrow -->
                                            <div class="slds-col slds-no-flex location-arrow">
                                                <lightning-icon
                                                    icon-name="utility:chevronright"
                                                    size="x-small"
                                                    alternative-text="Select"
                                                    class="row-arrow"
                                                ></lightning-icon>
                                            </div>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>

                        <template if:false={hasLocations}>
                            <div class="no-locations-state">
                                <lightning-icon
                                    icon-name="utility:map"
                                    size="large"
                                    alternative-text="No Locations"
                                    class="no-loc-icon"
                                ></lightning-icon>
                                <p class="no-loc-msg">No available tours for this time slot.</p>
                                <p class="no-loc-sub">Please select a different time.</p>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Modal Footer -->
                <footer class="slds-modal__footer modal-footer">
                    <lightning-button
                        label="Cancel"
                        variant="neutral"
                        onclick={handleCancel}
                        class="slds-m-right_small"
                    ></lightning-button>
                    <lightning-button
                        label="Next"
                        variant="brand"
                        icon-name="utility:forward"
                        icon-position="right"
                        disabled={isNextDisabled}
                        onclick={handleNext}
                    ></lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </div>
</template>
